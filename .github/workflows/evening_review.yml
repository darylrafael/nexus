name: Nexus Evening Review

on:
  schedule:
    # 11:55 UTC Mon-Fri = 18:55 WIB Mon-Fri
    - cron: '55 11 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-run even if already completed today'
        required: false
        default: false
        type: boolean

jobs:
  evening-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Evening Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
          PYTHONUTF8: "1"
        run: |
          python -c "from scheduler import evening_review; evening_review()"

      - name: Commit and push run artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p dashboard/data/runs
          cp -r runs/* dashboard/data/runs/ 2>/dev/null || true
          git add -f runs/ dashboard/data/runs/
          if git diff --staged --quiet; then
            echo "No new artifacts to commit."
          else
            git commit -m "chore(data): auto-archive evening review artifacts"
            git pull --rebase --autostash origin main || (git rebase --abort && git pull -s recursive -X ours origin main)
            git push origin main
          fi

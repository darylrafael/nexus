name: Nexus Evening Review

on:
  schedule:
    # 11:35 UTC Mon-Fri = 18:35 WIB Mon-Fri (early window: IDX closes 16:15 WIB, off-peak minute)
    - cron: '35 11 * * 1-5'
    # 11:52 UTC Mon-Fri = 18:52 WIB Mon-Fri (main target window)
    - cron: '52 11 * * 1-5'
    # Fallback retry schedules (19:12 & 19:32 WIB) in case runner queue was congested
    - cron: '12 12 * * 1-5'
    - cron: '32 12 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-run even if already completed today'
        required: false
        default: false
        type: boolean
      target_date:
        description: 'Specific date to evaluate (YYYY-MM-DD), leave blank for auto-resolve'
        required: false
        default: ''
        type: string

concurrency:
  group: evening-review
  cancel-in-progress: false

jobs:
  evening-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase false

      - name: Execute Evening Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
          TARGET_DATE: ${{ inputs.target_date || '' }}
          PYTHONUTF8: "1"
        run: |
          python -c "from scheduler import evening_review; evening_review()"

      - name: Commit and push run artifacts
        run: |
          mkdir -p dashboard/data/runs
          cp -r runs/* dashboard/data/runs/ 2>/dev/null || true
          git add -f runs/ dashboard/data/runs/
          if git diff --staged --quiet; then
            echo "No new artifacts to commit."
          else
            git commit -m "chore(data): auto-archive evening review artifacts [skip ci]" || true
            MAX_RETRIES=4
            RETRY_COUNT=0
            PUSH_SUCCESS=false
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "Attempting git push (try $((RETRY_COUNT + 1)) of $MAX_RETRIES)..."
              if git pull --no-edit -X ours origin main && git push origin main; then
                echo "Successfully pushed artifacts to GitHub!"
                PUSH_SUCCESS=true
                break
              fi
              echo "Push failed or remote updated, retrying in 3 seconds..."
              sleep 3
              RETRY_COUNT=$((RETRY_COUNT + 1))
            done
            if [ "$PUSH_SUCCESS" = false ]; then
              echo "ERROR: Failed to push artifacts to GitHub after $MAX_RETRIES attempts!"
              exit 1
            fi
          fi

name: Nexus Morning Brief

on:
  schedule:
    # 23:55 UTC Sun-Thu = 06:55 WIB Mon-Fri (canonical schedule from schedule.yaml)
    - cron: '55 23 * * 0-4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-run even if already completed today'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [morning-brief, trigger-brief]

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase false

      - name: Sync Latest Repository State
        run: |
          git pull --no-edit origin main || true

      - name: Holiday-Aware IDX Trading Day Check
        id: trading_day
        env:
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          python -c "
          import os
          from data_sources.market_data import jakarta_now
          from core.calendar import is_idx_trading_day, get_holiday_reason
          now = jakarta_now()
          forced = os.getenv('FORCE_RUN', '').lower() in ('true', '1', 'yes')
          trading = is_idx_trading_day(now)
          reason = get_holiday_reason(now) or 'Trading day'
          print(f'[calendar] Date={now.strftime(\"%Y-%m-%d\")} trading={trading} forced={forced} ({reason})')
          "

      - name: Execute Morning Brief (run_market_brief via scheduler.daily_brief)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ inputs.force || 'false' }}
          PYTHONUTF8: "1"
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m nexus brief --force
          else
            python -m nexus brief
          fi

      - name: Upload Morning Brief Run Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief-runs-${{ github.run_id }}
          path: |
            runs/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit and push run artifacts
        run: |
          mkdir -p dashboard/data/runs
          cp -r runs/* dashboard/data/runs/ 2>/dev/null || true
          git add -f runs/ dashboard/data/runs/
          if git diff --staged --quiet; then
            echo "No new artifacts to commit."
          else
            git commit -m "chore(data): sync morning brief artifacts" || true
            MAX_RETRIES=4
            RETRY_COUNT=0
            PUSH_SUCCESS=false
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "Attempting git push (try $((RETRY_COUNT + 1)) of $MAX_RETRIES)..."
              if git pull --no-edit -X ours origin main && git push origin main; then
                echo "Successfully pushed artifacts to GitHub!"
                PUSH_SUCCESS=true
                break
              fi
              echo "Push failed or remote updated, retrying in 3 seconds..."
              sleep 3
              RETRY_COUNT=$((RETRY_COUNT + 1))
            done
            if [ "$PUSH_SUCCESS" = false ]; then
              echo "ERROR: Failed to push artifacts to GitHub after $MAX_RETRIES attempts!"
              exit 1
            fi
          fi

      - name: Send Failure Alert on Job Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEXUS_SKIP_ENV_VALIDATION: "1"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -c "
          import os
          from delivery.telegram import send_report
          send_report(f'❌ *Nexus Morning Brief Workflow FAILED*\nRun: {os.getenv(\"RUN_URL\", \"unknown\")}')
          " || true
